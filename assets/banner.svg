<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rohit Negi - Machine Learning Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#243044"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="0" ry="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="150" cy="60" r="260" fill="url(#glow)"/>
    <circle cx="1080" cy="270" r="280" fill="url(#glow2)"/>

    <!-- grid -->
    <g stroke="#1e293b" stroke-width="1" opacity="0.55">
      <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200"/>
      <path d="M60 0V320M180 0V320M300 0V320M420 0V320M540 0V320M660 0V320M780 0V320M900 0V320M1020 0V320M1140 0V320"/>
    </g>

    <!-- animated accent bar -->
    <rect x="0" y="0" width="1200" height="5" fill="url(#accent)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- pulse rings on the right -->
    <g transform="translate(1120 150)" fill="none" stroke="#38bdf8" stroke-width="1.5">
      <circle r="26" opacity="0.9"/>
      <circle r="26" opacity="0.6">
        <animate attributeName="r" values="26;70" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="26" opacity="0.6">
        <animate attributeName="r" values="26;70" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle r="7" fill="#38bdf8" stroke="none"/>
    </g>

    <!-- label -->
    <text x="84" y="104" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="3.5" fill="#7dd3fc">HELLO, I AM</text>

    <!-- name -->
    <text x="80" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="-1">Rohit Negi</text>

    <!-- accent underline -->
    <rect x="84" y="196" width="330" height="7" rx="3.5" fill="url(#accent)">
      <animate attributeName="width" values="330;430;330" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="84" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" fill="#cbd5e1">Machine Learning Engineer · Explainable AI · Applied Deep Learning</text>

    <!-- stack line: plain text (no fixed-width boxes) so it never overflows in any browser font -->
    <text x="84" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#94a3b8">Python · Flask · scikit-learn · TensorFlow · Next.js · MongoDB · RAG · Vercel
      <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
